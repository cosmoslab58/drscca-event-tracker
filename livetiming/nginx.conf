server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.htm index.html;
    charset iso-8859-1;
    autoindex off;
    # Results change every minute: never let a browser or proxy keep an old copy.
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/index.htm $uri/index.html /waiting.html; }
}
