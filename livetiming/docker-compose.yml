# Live timing for drscca.org: AXWare uploads its HTML pages over SFTP, and they are served at livetiming.drscca.org.
# Each program has its own SFTP login (users.conf, not in git) that can only write its own folder (autocross or
# rallycross); the website's own login is never shared. Logins, host keys and the pages live in ~/livetiming-data on bodhi only (never in git or the laptop mirror).
# Run on bodhi: cd livetiming && docker compose up -d
services:
  livetiming-sftp:
    image: atmoz/sftp:alpine
    container_name: livetiming-sftp
    restart: unless-stopped
    network_mode: bridge   # bodhi has no free address pools for a new network
    ports:
      - "2222:22"
    volumes:
      - ~/livetiming-data/users.conf:/etc/sftp/users.conf:ro
      - ~/livetiming-data/keys/ssh_host_ed25519_key:/etc/ssh/ssh_host_ed25519_key:ro
      - ~/livetiming-data/keys/ssh_host_rsa_key:/etc/ssh/ssh_host_rsa_key:ro
      - ~/livetiming-data/www/autocross:/home/autocross/livetiming
      - ~/livetiming-data/www/rallycross:/home/rallycross/livetiming

  livetiming-web:
    image: nginx:alpine
    container_name: livetiming-web
    restart: unless-stopped
    network_mode: bridge   # bodhi has no free address pools for a new network
    ports:
      - "8873:80"
    volumes:
      - ~/livetiming-data/www:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
