services:
  web:
    # Per-deployment: set CONTAINER_NAME in the gitignored .env, so more than one
    # instance (for example a demo copy) can run on the same host.
    container_name: ${CONTAINER_NAME:-drscca-event-tracker}
    build: .
    ports:
      # Host port is per-deployment for the same reason (HOST_PORT in .env).
      # Put a reverse proxy with HTTPS (Caddy, nginx, Cloudflare Tunnel) in front.
      - "${HOST_PORT:-5858}:5858"
    volumes:
      - ./data:/app/data
      # Google service account key for STORAGE_BACKEND=sheets (the data lives in the
      # DRSCCA Apps Shared Drive). Host path set per deployment in .env.
      - ${GOOGLE_SA_KEY_HOST:-/dev/null}:/run/secrets/google-sa.json:ro
      # Region officials (who approves what): read-only, so nobody can change an approver through the app.
      # Host path per deployment in .env; /dev/null when unused.
      - ${OFFICIALS_HOST:-/dev/null}:/run/secrets/officials.json:ro
    env_file:
      - .env
    environment:
      - FLASK_ENV=production
      - PORT=5858
    command: gunicorn -w 4 -b 0.0.0.0:5858 app:app
    restart: unless-stopped
